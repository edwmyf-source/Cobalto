<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- DNS/conexión temprana: reduce latencia de primera petición de datos -->
    <link rel="preconnect" href="https://oazbsvkysymahdudiodi.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://oazbsvkysymahdudiodi.supabase.co" />
    <!-- Storage de Supabase (avatares, imágenes de posts) -->
    <link rel="preconnect" href="https://oazbsvkysymahdudiodi.supabase.co" crossorigin />

    <!-- Fuente: preconnect primero, luego carga no-bloqueante -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DM Sans variable: un solo archivo cubre todos los pesos de 400 a 800 -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/redcobalto-mark.svg" />
    <meta name="apple-mobile-web-app-title" content="REDCobalto" />
    <title>REDCobalto — Comunidad profesional</title>
    <meta name="description" content="Red social B2B para laboratorio e industria en Colombia. Impulsamos a conectar el sector químico." />
    <meta name="theme-color" content="#162A4A" />

    <!-- Evita FOUC: el fondo aparece antes del JS -->
    <style>
      body { background: #F7F8FA; margin: 0; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
